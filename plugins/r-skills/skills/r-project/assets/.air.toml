# https://posit-dev.github.io/air/configuration.html
[format]
line-width = 119
indent-width = 2
indent-style = "tab"
line-ending = "auto"
persistent-line-breaks = true
assignment-style = "arrow"
exclude = [
  ".rvenv/",
  ".rvenvlib/"
]
default-exclude = true
skip = []
table = []
default-table = true